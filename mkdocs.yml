site_name: Agentic ChIMES
site_description: >-
  A tool-calling CLI and Python API for building ChIMES machine-learned
  interatomic potentials end to end.
repo_url: https://github.com/laubachb/Agentic-ChIMES
repo_name: laubachb/Agentic-ChIMES
edit_uri: edit/master/docs/
docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - navigation.sections
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - def_list
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - md_in_html

plugins:
  - search

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting started: getting_started.md
  - User guide:
      - Running a study: guide/running_a_study.md
      - Study layout and artifacts: guide/study_layout.md
      - The agents: guide/agents.md
      - Compute, approvals and costs: guide/compute.md
      - Troubleshooting: guide/troubleshooting.md
      - "Worked example: Cu-Zr": guide/example_cuzr.md
  - Commands:
      - commands/index.md
      - All options: commands/options.md
      - Study:
          - study: commands/study.md
          - usage: commands/usage.md
          - study-report: commands/study-report.md
      - Data:
          - data-search: commands/data-search.md
          - data-fetch: commands/data-fetch.md
          - data-generate: commands/data-generate.md
          - data-curate: commands/data-curate.md
          - fingerprint: commands/fingerprint.md
          - quests: commands/quests.md
          - dataset-select: commands/dataset-select.md
          - qe-relabel: commands/qe-relabel.md
          - qe-converge: commands/qe-converge.md
      - Hyperparameters and fitting:
          - hyper-analyze: commands/hyper-analyze.md
          - hyper-search: commands/hyper-search.md
          - learning-curve: commands/learning-curve.md
          - fm-setup-gen: commands/fm-setup-gen.md
          - amat-build: commands/amat-build.md
          - solve: commands/solve.md
          - weights: commands/weights.md
          - hierarch: commands/hierarch.md
          - model-build: commands/model-build.md
          - sweep: commands/sweep.md
          - auto-build: commands/auto-build.md
          - evaluate: commands/evaluate.md
      - Active learning:
          - al-select: commands/al-select.md
          - al-merge: commands/al-merge.md
          - al-batch: commands/al-batch.md
          - al-status: commands/al-status.md
          - committee: commands/committee.md
          - al-run: commands/al-run.md
      - MD, performance, deployment:
          - lammps-run: commands/lammps-run.md
          - md-check: commands/md-check.md
          - eos-check: commands/eos-check.md
          - benchmark: commands/benchmark.md
          - deploy: commands/deploy.md
      - Infrastructure:
          - setup: commands/setup.md
          - doctor: commands/doctor.md
          - submit: commands/submit.md
          - job-status: commands/job-status.md
  - Methods:
      - The workflow in pictures: concepts/workflow.md
      - The ChIMES model: concepts/chimes_model.md
      - Data selection and coverage: concepts/data_selection.md
      - Active learning: concepts/active_learning.md
      - How a model is chosen: concepts/model_selection.md
      - Literature: concepts/literature.md
  - Concepts:
      - concepts/stages_and_contracts.md
      - concepts/claude_code_integration.md
      - concepts/data_curation.md
      - concepts/cutoffs_and_lambdas.md
      - concepts/units_and_conventions.md
      - concepts/machine_profiles.md
