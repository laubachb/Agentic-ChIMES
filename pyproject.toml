[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-chimes"
version = "0.1.0"
description = "Tool-calling CLI and Python API for building ChIMES machine-learned interatomic potentials end to end."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Benjamin R. Laubach" }]

dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "scikit-learn>=1.1",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]
data = [
    "ase>=3.23",
    "pyarrow>=14",
    "huggingface_hub>=0.23",
    "requests>=2.28",
    "fsspec>=2023.1",
    "aiohttp>=3.8",
]
al-select = [
    "matplotlib>=3.5",
    "cycler>=0.11",
]
plots = [
    "matplotlib>=3.5",
]
quests = [
    "quests>=2025.3",
    "numba>=0.59",
]

[project.scripts]
chimes-agent = "agentic_chimes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agentic_chimes" = ["schemas/*.json", "machines/profiles/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
markers = [
    "hpc: requires a real HPC allocation/Slurm submission, not run by default",
]
